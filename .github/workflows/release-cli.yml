name: Release CLI Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Build & Release Binaries
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build and Upload
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: auwgent,auwgent-lsp
          archive: auwgent-${{ matrix.target }}
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
          manifest-path: auwgent-compiler/Cargo.toml

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: |
            auwgent-${{ matrix.target }}.zip
            auwgent-${{ matrix.target }}.tar.gz

  publish:
    name: Publish to NPM
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: binaries-*
          merge-multiple: true

      - name: Publish Architecture Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          
          # Define architectures
          # [target]="npm-suffix:os:cpu"
          declare -A ARCHS
          ARCHS["x86_64-pc-windows-msvc"]="win32-x64-msvc:win32:x64"
          ARCHS["x86_64-unknown-linux-gnu"]="linux-x64-gnu:linux:x64"
          ARCHS["x86_64-apple-darwin"]="darwin-x64:darwin:x64"
          ARCHS["aarch64-apple-darwin"]="darwin-arm64:darwin:arm64"

          for TARGET in "${!ARCHS[@]}"; do
            IFS=':' read -r NPM_ARCH OS CPU <<< "${ARCHS[$TARGET]}"
            PKG_NAME="@snrraptopack/auwgent-cli-$NPM_ARCH"
            DIR="publish-$NPM_ARCH"
            
            echo "Preparing $PKG_NAME..."
            mkdir -p "$DIR/bin"
            
            # Extract binary from archive
            if [[ -f "artifacts/auwgent-$TARGET.zip" ]]; then
              unzip "artifacts/auwgent-$TARGET.zip" -d "$DIR/bin"
            else
              tar -xzf "artifacts/auwgent-$TARGET.tar.gz" -C "$DIR/bin"
            fi
            
            # Create package.json
            cat > "$DIR/package.json" <<EOF
          {
            "name": "$PKG_NAME",
            "version": "$VERSION",
            "os": ["$OS"],
            "cpu": ["$CPU"],
            "bin": {
              "auwgent": "bin/auwgent",
              "auwgent-lsp": "bin/auwgent-lsp"
            },
            "files": ["bin/*"]
          }
          EOF
            
            # Fix windows binary names in package.json if needed
            if [[ "$OS" == "win32" ]]; then
              sed -i 's/"auwgent"/"auwgent.exe"/g' "$DIR/package.json"
              sed -i 's/"auwgent-lsp"/"auwgent-lsp.exe"/g' "$DIR/package.json"
            fi

            echo "Publishing $PKG_NAME..."
            cd "$DIR"
            npm publish --access public || echo "Already published?"
            cd ..
          done

      - name: Publish Main CLI Wrapper
        working-directory: targets/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Update version to match tag
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version
          
          # Optional: Update optionalDependencies versions to match
          # (Simplified for now, assuming they follow the same version)
          
          npm publish --access public
