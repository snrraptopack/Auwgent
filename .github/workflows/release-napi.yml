name: Release TypeScript SDK

on:
  push:
    tags:
      - 'ts-v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Node Modules
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: targets/typescript
        run: bun install

      - name: Build
        working-directory: targets/typescript
        run: npm run build -- --target ${{ matrix.target }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: targets/typescript/*.node

  publish:
    name: Publish to NPM
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        working-directory: targets/typescript
        run: bun install

      - name: Download all bindings
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bindings-*
          merge-multiple: true

      - name: Publish Architecture Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#ts-v}"
          
          # Define architectures for SDK
          # [target]="npm-suffix:os:cpu:binary-name"
          declare -A ARCHS
          ARCHS["x86_64-pc-windows-msvc"]="win32-x64-msvc:win32:x64:auwgent-runtime.win32-x64-msvc.node"
          ARCHS["x86_64-unknown-linux-gnu"]="linux-x64-gnu:linux:x64:auwgent-runtime.linux-x64-gnu.node"
          ARCHS["x86_64-apple-darwin"]="darwin-x64:darwin:x64:auwgent-runtime.darwin-x64.node"
          ARCHS["aarch64-apple-darwin"]="darwin-arm64:darwin:arm64:auwgent-runtime.darwin-arm64.node"

          for TARGET in "${!ARCHS[@]}"; do
            IFS=':' read -r NPM_ARCH OS CPU BIN_NAME <<< "${ARCHS[$TARGET]}"
            PKG_NAME="@snrraptopack/auwgent-sdk-$NPM_ARCH"
            DIR="publish-sdk-$NPM_ARCH"
            
            echo "Preparing $PKG_NAME..."
            mkdir -p "$DIR"
            
            cp "artifacts/$BIN_NAME" "$DIR/$BIN_NAME"
            
            # Create package.json for the native sub-package
            cat > "$DIR/package.json" <<EOF
          {
            "name": "$PKG_NAME",
            "version": "$VERSION",
            "os": ["$OS"],
            "cpu": ["$CPU"],
            "main": "$BIN_NAME",
            "files": ["$BIN_NAME"]
          }
          EOF

            echo "Publishing $PKG_NAME..."
            cd "$DIR"
            npm publish --access public || echo "Already published?"
            cd ..
          done

      - name: Publish Main SDK
        working-directory: targets/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Version is already set in package.json before the tag is pushed.
          # Just remove any stale local .node files to keep the package slim,
          # then publish.
          rm -f *.node
          npm publish --access public
