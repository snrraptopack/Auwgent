[build-system]
requires = ["maturin>=1.5"]
build-backend = "maturin"

[project]
name = "auwgent-sdk"
version = "0.1.0-alpha.11"
requires-python = ">=3.8"
description = "The Python SDK for Auwgent — a compiler-first framework for building production-grade AI agents."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "snrraptopack", email = "snrraptopack@gmail.com" }
]
keywords = ["ai", "agents", "llm", "auwgent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/snrraptopack/Auwgent"
Repository = "https://github.com/snrraptopack/Auwgent"
Documentation = "https://auwgent.dev"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "auwgent_sdk._auwgent_sdk"
python-source = "."
