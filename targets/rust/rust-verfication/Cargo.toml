[package]
name = "auwgent-testing"
version = "0.1.0"
edition = "2024"

[dependencies]
auwgent_sdk_rust = { path = "..", package = "auwgent-sdk-rust" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "net", "sync"] }
