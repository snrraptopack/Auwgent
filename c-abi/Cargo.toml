[package]
name = "auwgent-c-abi"
version = "0.1.0"
edition = "2024"

[lib]
name = "auwgent_c_abi"
crate-type = ["cdylib"]

[dependencies]
auwgent-bridge = { path = "../runtime/crates/auwgent-bridge" }
auwgent-runtime-core = { path = "../runtime/crates/auwgent-runtime-core" }
serde_json = "1.0"
tokio = { version = "1.43", features = ["rt", "rt-multi-thread"] }
