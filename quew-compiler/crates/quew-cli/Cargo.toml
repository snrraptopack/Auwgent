[package]
name = "quew-cli"
version = "0.1.0"
edition = "2024"
description = "CLI binary for the quew compiler: compile, check, generate, watch."
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "quew"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
quew-errors = { path = "../quew-errors" }
quew-interner = { path = "../quew-interner" }
quew-source = { path = "../quew-source" }
quew-lexer = { path = "../quew-lexer" }
quew-parser = { path = "../quew-parser" }
quew-checker = { path = "../quew-checker" }
quew-ir = { path = "../quew-ir" }
quew-codegen = { path = "../quew-codegen" }

[dev-dependencies]
insta = { workspace = true }
