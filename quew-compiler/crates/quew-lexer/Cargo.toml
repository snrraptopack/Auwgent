[package]
name = "quew-lexer"
version = "0.1.0"
edition = "2024"
description = "logos-based tokenizer for the quew DSL. Transforms source text into a token stream."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
logos = { workspace = true }
quew-errors = { path = "../quew-errors" }
quew-interner = { path = "../quew-interner" }
quew-source = { path = "../quew-source" }

[dev-dependencies]
insta = { workspace = true }
