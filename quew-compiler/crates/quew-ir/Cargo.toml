[package]
name = "quew-ir"
version = "0.1.0"
edition = "2024"
description = "AST → ExecutionGraph lowering for the quew compiler. In-memory native Rust structs; no JSON serialization."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# No serde / serde_json — the IR is in-memory Rust structs.
# Journal/checkpoint serialization belongs in the runtime crate, not here.
indexmap   = { workspace = true }
quew-errors   = { path = "../quew-errors" }
quew-interner = { path = "../quew-interner" }
quew-lexer    = { path = "../quew-lexer" }
quew-ast      = { path = "../quew-ast" }
quew-checker  = { path = "../quew-checker" }
quew-types    = { path = "../quew-types" }

[dev-dependencies]
quew-parser = { path = "../quew-parser" }
quew-source = { path = "../quew-source" }
