[package]
name = "quew-runtime"
version = "0.1.0"
edition = "2024"
description = "Deterministic graph executor for the quew compiler. Evaluates compiled QuewGraphIR into runtime values."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
indexmap    = { workspace = true }
quew-ir     = { path = "../quew-ir" }
quew-interner = { path = "../quew-interner" }

[dev-dependencies]
quew-lexer    = { path = "../quew-lexer" }
quew-parser   = { path = "../quew-parser" }
quew-checker  = { path = "../quew-checker" }
quew-source   = { path = "../quew-source" }
quew-errors   = { path = "../quew-errors" }
