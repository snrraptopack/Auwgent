[workspace]
members = [
    "crates/auwgent-errors",
    "crates/auwgent-ast",
    "crates/auwgent-lexer",
    "crates/auwgent-parser",
    "crates/auwgent-checker",
    "crates/auwgent-analysis",
    "crates/auwgent-lsp",
    "crates/auwgent-ir",
    "crates/auwgent-codegen",
    "crates/auwgent-cli",
]
resolver = "2"

[workspace.dependencies]
# Shared across crates
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
chumsky = "0.9"
ariadne = "0.4"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tower-lsp = "0.20"
