<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hello Orb</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#0a0a0f;overflow:hidden}
  hello-orb{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<hello-orb></hello-orb>

<script>
customElements.define('hello-orb', class extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({mode:'open'});
    this.shadowRoot.innerHTML = `
      <style>
        :host{
          display:block;width:100%;height:100%;
          background:#0a0a0f;
          position:relative;
        }
        #bloom{
          position:absolute;inset:0;
          background:radial-gradient(circle at center, #0c0044 0%, #7f00ff 100%);
          opacity:0;
          animation:bloom 400ms forwards;
        }
        @keyframes bloom{
          from{opacity:0;transform:scale(0)}
          to{opacity:1;transform:scale(1)}
        }
        svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
        #orb{
          position:absolute;left:50%;top:50%;
          width:48px;height:48px;
          transform:translate(-50%,-50%);
          border-radius:50%;
          background:radial-gradient(circle, #7f00ff 0%, #7f00ff 100%);
          opacity:0;
          transition:opacity 300ms;
          --glow:#7f00ff;
        }
        #orb.visible{opacity:1}
        #orb:hover,#orb:focus{
          background:radial-gradient(circle, var(--glow) 0%, var(--glow) 100%);
          transition:background 200ms cubic-bezier(.4,0,.2,1);
          --glow:#ff6e4a;
        }
      </style>
      <div id="bloom" hidden></div>
      <svg id="wave" aria-hidden="true"></svg>
      <div id="orb" tabindex="0" aria-hidden="true"></div>
    `;
    this.bloom = this.shadowRoot.getElementById('bloom');
    this.svg = this.shadowRoot.getElementById('wave');
    this.orb = this.shadowRoot.getElementById('orb');
    this.path = null;
    this.audioCtx = null;
    this.analyser = null;
    this.recognizer = null;
    this.raf = null;
    this.speaking = false;
  }
  connectedCallback() {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) return;
    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
    this.recognizer = new Speech();
    this.recognizer.continuous = true;
    this.recognizer.interimResults = true;
    this.recognizer.lang = 'en-US';
    this.recognizer.onresult = e => {
      const last = e.results[e.results.length-1];
      if (last.isFinal && /hello/i.test(last[0].transcript)) {
        this.ignite();
      }
    };
    this.recognizer.start();
  }
  ignite() {
    if (this.bloom.hidden) {
      this.bloom.hidden = false;
      this.startAudio();
    }
  }
  startAudio() {
    navigator.mediaDevices.getUserMedia({audio:true}).then(stream => {
      this.audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      this.analyser = this.audioCtx.createAnalyser();
      this.analyser.fftSize = 256;
      const source = this.audioCtx.createMediaStreamSource(stream);
      source.connect(this.analyser);
      this.draw();
    }).catch(()=>{});
  }
  draw() {
    const data = new Uint8Array(this.analyser.frequencyBinCount);
    this.analyser.getByteFrequencyData(data);
    const width = window.innerWidth;
    const height = window.innerHeight;
    const step = width / data.length;
    let d = `M0,${height}`;
    let silent = true;
    for (let i=0;i<data.length;i++){
      const y = height - (data[i]/255)*height*0.5;
      d += `L${i*step},${y}`;
      if (data[i]>10) silent=false;
    }
    if (!this.path) {
      this.path = document.createElementNS('http://www.w3.org/2000/svg','path');
      this.path.setAttribute('fill','none');
      this.path.setAttribute('stroke','#7f00ff');
      this.path.setAttribute('stroke-width','1');
      this.path.setAttribute('stroke-linecap','round');
      this.svg.appendChild(this.path);
    }
    this.path.setAttribute('d',d);
    if (!silent) this.speaking = true;
    if (silent && this.speaking) {
      this.speaking = false;
      this.collapse();
      return;
    }
    this.raf = requestAnimationFrame(()=>this.draw());
  }
  collapse() {
    cancelAnimationFrame(this.raf);
    this.svg.style.transition = 'opacity 300ms';
    this.svg.style.opacity = '0';
    setTimeout(()=>{
      this.svg.remove();
      this.orb.classList.add('visible');
    },300);
  }
  disconnectedCallback() {
    if (this.recognizer) this.recognizer.stop();
    if (this.audioCtx) this.audioCtx.close();
    cancelAnimationFrame(this.raf);
  }
});
</script>
</body>
</html>
