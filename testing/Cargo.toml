[package]
name = "auwgent-testing"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
auwgent_sdk_rust = { package = "auwgent-sdk-rust", path = "../targets/rust" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "net", "sync"] }
async-trait = "0.1"
axum = "0.8"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "net", "sync"] }
async-trait = "0.1"
axum = "0.8"