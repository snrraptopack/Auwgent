[package]
name = "auwgent-napi"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
ir-runtime = { path = ".." }
napi = { version = "2", features = ["async", "napi8", "serde-json"] }
napi-derive = "2"
tokio = { version = "1.43", features = ["full"] }
serde_json = "1.0"
futures-util = "0.3"

[build-dependencies]
napi-build = "2"
