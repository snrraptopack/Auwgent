[workspace]
members = ["."]
resolver = "2"

[package]
name = "ir-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
async-trait = "0.1"
futures-util = "0.3"
function-parser = { path = "../function-parser" }
auwgent-ir-schema = { path = "../auwgent-compiler/crates/auwgent-ir-schema" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1.43", features = ["rt", "rt-multi-thread", "time", "macros", "sync"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
tokio = { version = "1.43", features = ["rt", "macros", "sync"] }

[profile.dev]
debug = 0
incremental = true
codegen-units = 256

[profile.test]
debug = 0
incremental = true
codegen-units = 256
